@if (deploymentName) {
<div class="rollout-console">
  <!-- Compact toggle row -->
  <div class="rollout-toggle" [class.collapsed]="!isExpanded" (click)="onToggleExpanded()">
    <span class="rollout-toggle-label">
      Rollout
      @if (deploymentStatus && buttonStates) {
        <span class="status-text">{{ getStatusText() }}</span>
      }
    </span>
    <div class="rollout-toggle-right">
      <!-- Status Lights -->
      <div class="status-lights">
        <div class="status-dot" [style.background-color]="getStatusColor('red')"></div>
        <div class="status-dot" [style.background-color]="getStatusColor('yellow')"></div>
        <div class="status-dot" [style.background-color]="getStatusColor('green')"></div>
      </div>
      <span class="toggle-arrow" [class.expanded]="isExpanded">&#9662;</span>
    </div>
  </div>

  <!-- Expandable content -->
  <div class="rollout-body" [class.expanded]="isExpanded">
    <!-- Player Controls -->
    <div class="player-row">
      <button class="player-btn rollback-btn"
        [title]="getRollbackTooltip()" [disabled]="!buttonStates?.rollbackEnabled || actionPending !== null"
        [class.disabled]="!buttonStates?.rollbackEnabled" [class.loading]="actionPending === 'Undo Last'"
        (click)="onRollbackToPrevious()">
        <mat-icon>{{ actionPending === 'Undo Last' ? 'autorenew' : 'skip_previous' }}</mat-icon>
      </button>
      <button class="player-btn pause-btn"
        [title]="getPauseTooltip()" [disabled]="!buttonStates?.pauseEnabled || actionPending !== null"
        [class.disabled]="!buttonStates?.pauseEnabled" [class.loading]="actionPending === 'Pause'"
        (click)="onPauseRollout()">
        <mat-icon>{{ actionPending === 'Pause' ? 'autorenew' : 'pause' }}</mat-icon>
      </button>
      <button class="player-btn play-btn"
        [title]="getResumeTooltip()" [disabled]="!buttonStates?.resumeEnabled || actionPending !== null"
        [class.disabled]="!buttonStates?.resumeEnabled" [class.loading]="actionPending === 'Resume'"
        (click)="onResumeRollout()">
        <mat-icon>{{ actionPending === 'Resume' ? 'autorenew' : 'play_arrow' }}</mat-icon>
      </button>
      <button class="player-btn restart-btn"
        [title]="getRestartTooltip()" [disabled]="!buttonStates?.restartEnabled || actionPending !== null"
        [class.disabled]="!buttonStates?.restartEnabled" [class.loading]="actionPending === 'Restart'"
        (click)="onRestartDeployment()">
        <mat-icon>{{ actionPending === 'Restart' ? 'autorenew' : 'refresh' }}</mat-icon>
      </button>
      <span class="player-spacer"></span>
      <button class="player-btn refetch-btn" title="Refetch deployment status"
        [class.loading]="statusLoading" [disabled]="statusLoading || actionPending !== null"
        (click)="refetchStatus.emit()">
        <mat-icon>sync</mat-icon>
      </button>
    </div>

    <!-- Registry Tags -->
    @if (isKnownRegistry()) {
      <div class="registry-row">
        <div class="registry-label">
          Registry
          <span class="registry-image-url">{{ deploymentImage }}</span>
        </div>
        <div class="registry-tags">
          <button class="tag-btn" (click)="onLoadTags()" [disabled]="tagsLoading">
            {{ tagsLoading ? 'Loading...' : 'Load Tags' }}
          </button>
          @if (tagsError) {
            <span class="tag-error" [title]="tagsError">Error</span>
          }
          @if (registryTags.length > 0) {
            <select class="tag-select" [value]="selectedTag()" (change)="selectedTag.set($any($event.target).value)">
              <option value="" disabled>Select tag...</option>
              @for (tag of registryTags; track tag) {
                <option [value]="tag">{{ tag }}</option>
              }
            </select>
            <button class="tag-btn" [disabled]="!selectedTag() || actionPending !== null" (click)="onSelectTag(selectedTag())">
              {{ actionPending === 'Set Image' ? 'Setting...' : 'Set Image' }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
}
